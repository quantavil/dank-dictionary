name: Dictionary checks
on: [push, pull_request]
jobs:
  data-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node tests/lint.test.js
      - run: node tests/model.test.js
      - run: python3 tests/build-webster.test.py
      - run: python3 tests/data-smoke.py
# Actual Quickshell runtime suites remain required locally before publishing.
